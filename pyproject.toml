[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dict-build"
version = "1.4.0"
description = "Statistical Chinese new word discovery from raw text"
authors = [{ name = "wainshine" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["chinese", "nlp", "new-word-discovery", "dictionary", "ngram"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: Chinese (Traditional)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "marisa-trie>=1.0",
    "tqdm>=4.0",
    "click>=8.0",
    "jieba>=0.42",
    "regex>=2024.0",
    "charset-normalizer>=3.0",
]

[project.scripts]
dict-build = "dict_build.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["dict_build"]

[tool.setuptools.package-data]
"dict_build" = ["data/pos_prop.txt"]
