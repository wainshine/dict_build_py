[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dict-build"
version = "1.0.0"
description = "Statistical Chinese new word discovery from raw text"
authors = [{ name = "wainshine" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "marisa-trie>=1.0",
    "tqdm>=4.0",
    "click>=8.0",
    "jieba>=0.42",
    "regex>=2024.0",
]

[project.scripts]
dict-build = "dict_build.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["dict_build"]

[tool.setuptools.package-data]
"dict_build" = ["data/pos_prop.txt"]
