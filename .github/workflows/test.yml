name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Windows ships its own incompatible sort.exe; put Git's usr/bin
      # (GNU coreutils sort) first so the pipeline finds a real sort.
      - name: Expose GNU sort on Windows
        if: runner.os == 'Windows'
        run: echo "C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify GNU sort on Windows
        if: runner.os == 'Windows'
        run: sort --version

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest tests/ -q
